<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfarer Journeys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: single column — selected destination + form on top, 2-column photo grid below */
:root{
  --bg:#1f3d2b; --surface:#27493a; --line:#3f6650;
  --fg:#f1e7d0; --muted:#d9cba9;
  --green:#e8dcc0; --green-deep:#f6eedb; --green-soft:#36584a; --on-green:#1f3d2b;
  --input:#2c5040;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:grid;gap:36px}

header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--green-deep);letter-spacing:-.01em}
.tag{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Selected destination */
.picked{display:grid;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px}
.stage{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/8;max-width:100%;background:var(--green-soft)}
.stage img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .5s ease}
.stage .cap{position:absolute;left:16px;bottom:14px;right:16px;color:var(--fg);text-shadow:0 2px 14px rgba(0,0,0,.55)}
.cap .country{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.cap h1{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,4.5vw,2.8rem);line-height:1.05;text-wrap:balance}
@keyframes fade{from{opacity:.25;transform:scale(1.03)}to{opacity:1;transform:none}}

.form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;padding:4px 6px 8px}
.field{display:grid;gap:6px;min-width:0}
label{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;color:var(--fg);background:var(--input);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;transition:border-color .2s}
input:focus{outline:none;border-color:var(--fg);box-shadow:0 0 0 3px var(--green-soft)}
input::placeholder{color:var(--muted);opacity:.6}
input.bad{border-color:#e99a7f}
.hint.err{color:#f2b39c}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:13px 22px;background:var(--green);color:var(--on-green);transition:background .2s,transform .1s}
button:hover{background:var(--green-deep)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--green-soft);outline-offset:2px}
.hint{grid-column:1/-1;margin:0;font-size:.85rem;color:var(--muted);min-height:1.3em}

/* Grid */
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:1.6rem}
.section-head span{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{position:relative;padding:0;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--green-soft);border:3px solid transparent;color:var(--fg);text-align:left}
.card:hover{background:var(--green-soft)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card:hover img{transform:scale(1.05)}
.card .label{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(10,25,15,.72));font-weight:500}
.card .label small{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.card[aria-pressed="true"]{border-color:var(--fg)}
.card[aria-pressed="true"]::after{content:"Selected";position:absolute;top:10px;right:10px;background:var(--green);color:var(--on-green);font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px}

/* Success */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.toast{position:fixed;left:50%;top:50%;z-index:21;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;
  background:var(--green);color:var(--on-green);padding:22px 30px;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);
  text-align:center;transition:opacity .35s,transform .35s;width:min(90vw,380px)}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast strong{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.15}

@media (max-width:640px){
  .form{grid-template-columns:1fr}
  .stage{aspect-ratio:4/3}
  .grid{gap:10px}
  .card .label{padding:22px 10px 8px;font-size:.88rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section>
    <div class="grid" id="grid"></div>
  </section>
  <section class="picked" id="top" aria-live="polite" hidden>
    <div class="stage">
      <img id="stageImg" src="img/saint-lucia.jpg" alt="The Pitons above the sea, Saint Lucia">
      <div class="cap"><h1 id="stageTitle">Saint Lucia</h1></div>
    </div>
    <div class="form" id="form">
      <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" placeholder="Your name"></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <button type="button" id="send">Send request</button>
      <p class="hint" id="hint">Enter your name and email to send a request.</p>
    </div>
  </section>

</div>

<canvas id="fx"></canvas>
<div class="toast" id="toast" role="status"><strong>Request has been sent</strong></div>

<script>
const places=[
  {f:"saint-lucia",t:"Saint Lucia",c:"Saint Lucia",a:"The Pitons above the sea, Saint Lucia"},
  {f:"istanbul",t:"Istanbul",c:"Turkey",a:"Süleymaniye Mosque over the Golden Horn, Istanbul"},
  {f:"paris",t:"Paris",c:"France",a:"Eiffel Tower and the Seine at sunset, Paris"},
  {f:"cinque-terre",t:"Cinque Terre",c:"Italy",a:"Colourful houses of Manarola on the cliffs"},
  {f:"new-york",t:"New York",c:"USA",a:"Statue of Liberty and the Manhattan skyline"},
  {f:"egypt",t:"Egypt",c:"Egypt",a:"Pyramids above the Nile"},
  {f:"amsterdam",t:"Amsterdam",c:"Netherlands",a:"Canal and Munttoren at dusk, Amsterdam"},
  {f:"singapore",t:"Singapore",c:"Singapore",a:"Marina Bay Sands at night, Singapore"}
];
let current=-1;
const grid=document.getElementById('grid');
places.forEach((p,i)=>{
  const b=document.createElement('button');
  b.type='button';b.className='card';b.setAttribute('aria-pressed','false');
  b.innerHTML=`<img src="img/${p.f}.jpg" alt="${p.a}" loading="lazy"><span class="label">${p.c}</span>`;
  b.addEventListener('click',()=>select(i));
  grid.appendChild(b);
});
function select(i){
  current=i;const p=places[i];
  const img=document.getElementById('stageImg');
  img.style.animation='none';void img.offsetWidth;img.style.animation='';
  img.src=`img/${p.f}.jpg`;img.alt=p.a;
  document.getElementById('stageTitle').textContent=p.c;
  [...grid.children].forEach((c,j)=>c.setAttribute('aria-pressed',j===i));
  document.getElementById('top').hidden=false;
  document.getElementById('hint').textContent='Enter your name and email to send a request.';
  document.getElementById('top').scrollIntoView({behavior:'smooth',block:'start'});
}

const form=document.getElementById('form'),nameI=document.getElementById('name'),mailI=document.getElementById('email'),hint=document.getElementById('hint');
function sendRequest(){
  const okName=nameI.value.trim().length>1, okMail=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mailI.value.trim());
  nameI.classList.toggle('bad',!okName);mailI.classList.toggle('bad',!okMail);
  hint.classList.toggle('err',!okName||!okMail);
  if(!okName||!okMail){hint.textContent=!okName?'Enter your name (at least 2 letters).':'Enter a valid email, for example you@example.com.';return}
  celebrate();
  hint.textContent='';
  nameI.value='';mailI.value='';
}
document.getElementById('send').addEventListener('click',sendRequest);
[nameI,mailI].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendRequest()}}));
[nameI,mailI].forEach(i=>i.addEventListener('input',()=>{i.classList.remove('bad');hint.classList.remove('err')}));

/* Fireworks */
const cv=document.getElementById('fx'),ctx=cv.getContext('2d');let parts=[],rockets=[],running=false,until=0;
const colors=['#f5d76e','#ffffff','#7fd39a','#ff8a65','#ffd1dc','#9be7ff','#e8c27a'];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',size);size();
function launch(){rockets.push({x:innerWidth*(.15+Math.random()*.7),y:innerHeight,vy:-(9+Math.random()*4),ty:innerHeight*(.15+Math.random()*.35),c:colors[Math.random()*colors.length|0]})}
function burst(x,y,c){const n=70+Math.random()*40;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1.5+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:Math.random()<.3?'#ffffff':c})}}
function celebrate(){
  const t=document.getElementById('toast');t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3800);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  until=performance.now()+3200;for(let i=0;i<3;i++)setTimeout(launch,i*180);
  if(!running){running=true;requestAnimationFrame(tick)}
}
let last=0;
function tick(now){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  if(now<until&&now-last>320){launch();last=now}
  rockets=rockets.filter(r=>{r.y+=r.vy;r.vy*=.985;ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(r.x,r.y,2.5,0,7);ctx.fill();if(r.y<=r.ty||r.vy>-1.5){burst(r.x,r.y,r.c);return false}return true});
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.06;p.life-=.012;if(p.life<=0)return false;ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2,0,7);ctx.fill();return true});
  ctx.globalAlpha=1;
  if(parts.length||rockets.length||now<until)requestAnimationFrame(tick);else{running=false;ctx.clearRect(0,0,innerWidth,innerHeight)}
}
</script>
</body>
</html>
